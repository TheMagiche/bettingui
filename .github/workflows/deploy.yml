name: Deploy to Linode

# Required GitHub secrets:
#   LINODE_HOST, LINODE_USER, LINODE_SSH_PRIVATE_KEY
# Optional repository variable:
#   LINODE_APP_PORT (defaults to 80)
# Linode host needs Docker Engine with the Compose plugin, and the SSH user
# must be able to run docker (root, or a user in the docker group).

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-linode
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare remote deploy directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -eu
            mkdir -p "$HOME/bettingui/nginx"
            if [ -d "$HOME/bettingui/nginx/default.conf" ]; then
              rm -rf "$HOME/bettingui/nginx/default.conf"
            fi

      - name: Copy compose and nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx/default.conf"
          target: "bettingui"
          overwrite: true

      - name: Deploy image to Linode
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          BETTINGUI_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          APP_PORT: ${{ vars.LINODE_APP_PORT || 80 }}
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,BETTINGUI_IMAGE,APP_PORT
          script_stop: true
          command_timeout: 15m
          script: |
            set -eu
            cd "$HOME/bettingui"

            if [ -f default.conf ] && [ ! -f nginx/default.conf ]; then
              mkdir -p nginx
              mv default.conf nginx/default.conf
            fi
            if [ -d nginx/default.conf ]; then
              rm -rf nginx/default.conf
            fi
            if [ ! -f nginx/default.conf ]; then
              echo "nginx/default.conf is missing after copy"
              find . -maxdepth 3 -print
              exit 1
            fi

            DOCKER_CONFIG=$(mktemp -d)
            export DOCKER_CONFIG
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            chmod 700 "$DOCKER_CONFIG"
            auth=$(printf '%s' "$GHCR_USER:$GHCR_TOKEN" | openssl base64 -A)
            printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$auth" > "$DOCKER_CONFIG/config.json"
            chmod 600 "$DOCKER_CONFIG/config.json"

            docker compose pull
            docker compose up -d --remove-orphans --no-build --force-recreate

            docker image prune -f

            i=0
            while [ "$i" -lt 40 ]; do
              i=$((i + 1))
              if docker exec bettingui-nginx wget -q -O /dev/null -T 5 http://127.0.0.1/nginx-health \
                && docker exec bettingui-nginx wget -q -O /dev/null -T 5 http://127.0.0.1/; then
                echo "bettingui is up behind nginx"
                exit 0
              fi
              sleep 3
            done

            echo "Container started but nginx did not become ready in time"
            docker compose ps -a
            ls -la nginx || true
            docker compose logs --tail 120
            exit 1
