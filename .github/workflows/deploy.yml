name: Deploy to Coolify

# Required GitHub secrets:
#   COOLIFY_WEBHOOK — this Coolify resource’s Deploy Webhook
# Optional GitHub secrets:
#   COOLIFY_TOKEN — Bearer token if the webhook requires it

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-bettingui
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -eu
          if [ -z "${COOLIFY_WEBHOOK:-}" ]; then
            echo "COOLIFY_WEBHOOK secret is not set; skipping deploy trigger"
            exit 0
          fi
          if [ -n "${COOLIFY_TOKEN:-}" ]; then
            curl --fail --show-error --request POST "$COOLIFY_WEBHOOK" \
              --header "Authorization: Bearer $COOLIFY_TOKEN"
          else
            curl --fail --show-error --request POST "$COOLIFY_WEBHOOK"
          fi
