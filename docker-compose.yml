# Coolify: domain https://bettingui.work.gd → service app port 3000
# Do not publish 80/443. Do not run a sidecar nginx.
#
# Local: docker compose up --build
# Coolify: set BETTINGUI_IMAGE to the GHCR tag GitHub Actions pushes so the
# VPS pulls instead of compiling Chromium + Next.js on the box.

services:
  app:
    build: .
    image: ${BETTINGUI_IMAGE:-ghcr.io/themagiche/bettingui:latest}
    restart: unless-stopped
    shm_size: "1gb"
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      CHROME_PATH: /usr/bin/chromium
      CHROME_NO_SANDBOX: "1"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
