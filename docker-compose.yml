# Coolify: domain https://bettingui.work.gd → service app port 3003
# Do not publish 80/443. Do not run a sidecar nginx.
#
# Coolify pulls the GHCR image GitHub Actions pushes (no on-server build).
# Local: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build

services:
  app:
    image: ${BETTINGUI_IMAGE:-ghcr.io/themagiche/bettingui:latest}
    pull_policy: always
    restart: unless-stopped
    shm_size: "1gb"
    expose:
      - "3003"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3003"
      CHROME_PATH: /usr/bin/chromium
      CHROME_NO_SANDBOX: "1"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
