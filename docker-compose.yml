services:
  app:
    build: .
    image: ${BETTINGUI_IMAGE:-bettingui:local}
    container_name: bettingui
    restart: unless-stopped
    shm_size: "1gb"
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      CHROME_PATH: /usr/bin/chromium
      CHROME_NO_SANDBOX: "1"
    networks:
      - bettingui

  nginx:
    image: nginx:1.27-alpine
    container_name: bettingui-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bettingui

networks:
  bettingui:
    driver: bridge
